<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
    <section class="card">
        <div class="header">
            <h1>Report Generator</h1>
            <p>Flask backend test</p>
        </div>

        <div id="status" class="status offline">Checking backend...</div>

        <form id="reportForm">
            <div class="grid">
                <div class="field">
                    <label for="utReport">UT Report Number</label>
                    <input id="utReport" type="text" value="ND-UT-MA-25-127-SNCE-REP-106" required>
                </div>
                <div class="field">
                    <label for="vtReport">VT Report Number</label>
                    <input id="vtReport" type="text" value="ND-VT-MA-25-127-SNCE-REP-106" required>
                </div>
                <div class="field">
                    <label for="utInspector">UT Inspector</label>
                    <input id="utInspector" type="text" value="ABDELAZIZ EL ASRI" required>
                </div>
                <div class="field">
                    <label for="vtInspector">VT Inspector</label>
                    <input id="vtInspector" type="text" value="REDA EL OUIMA" required>
                </div>
                <div class="field">
                    <label for="date">Date</label>
                    <input id="date" type="text" value="23-09-2026" required>
                </div>
                <div class="field">
                    <label for="stamp">Stamp</label>
                    <input id="stamp" type="text" value="mou">
                </div>
                <div class="field">
                    <label for="count">Count</label>
                    <input id="count" type="number" min="1" value="12" required>
                </div>
                <div class="field">
                    <label for="vtFilename">VT Output Filename</label>
                    <input id="vtFilename" type="text" value="VT-Report.docx" required>
                </div>
                <div class="field">
                    <label for="utFilename">UT Output Filename</label>
                    <input id="utFilename" type="text" value="UT-Report.docx" required>
                </div>
            </div>

            <button id="generateBtn" type="submit">Generate Reports</button>
        </form>

        <div id="message" class="message"></div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
